<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-100">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TOTORITAS - Control de Acceso</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- FontInter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent blue highlights on touch devices */
    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    /* Smooth transitions */
    .animate-pop {
      animation: pop 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% {
        transform: scale(0.95);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body class="h-full bg-slate-100 text-slate-900 flex flex-col antialiased selection:bg-blue-600 selection:text-white">

  <!-- Header Bar -->
  <header
    class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-lg tracking-wider shadow-md shadow-blue-600/20">
        T
      </div>
      <div>
        <h1 class="font-extrabold text-base tracking-wider text-slate-900 leading-tight">TOTORITAS</h1>
        <p class="text-[10px] text-slate-500 font-bold tracking-tight">Control de Garita & SCTR</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Status Badge -->
      <span id="connectionBadge"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
        <span>Conectado</span>
      </span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 overflow-y-auto">

    <!-- ==================== PESTAÑA 1: VALIDAR ==================== -->
    <section id="tab-validar" class="space-y-4">

      <!-- Input Card -->
      <!-- Input Card con Selector de Modo Táctil -->
      <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-4">

        <!-- Selector táctil de modo (Pills) -->
        <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl border border-slate-200">
          <button id="btnModoSctr" type="button" onclick="setSearchMode('sctr')"
            class="py-2.5 px-3 rounded-lg text-xs font-black transition-all flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow-md shadow-blue-600/20">
            <span>👷‍♂️DNI (OBRAS)</span>
          </button>

          <button id="btnModoCeleste" type="button" onclick="setSearchMode('celeste')"
            class="py-2.5 px-3 rounded-lg text-xs font-black transition-all flex items-center justify-center gap-1.5 bg-transparent text-slate-500 hover:text-slate-800">
            <span>💳 Celestes</span>
          </button>
        </div>

        <!-- Campo de entrada adaptativo -->
        <div class="space-y-3">
          <label id="lblSearchInput" for="dniInput"
            class="block text-[11px] font-black text-slate-500 uppercase tracking-wider text-center">
            Ingrese DNI del trabajador
          </label>

          <input type="text" id="dniInput" placeholder="Escriba DNI aquí..." maxlength="8" inputmode="numeric"
            autocomplete="off"
            class="w-full bg-slate-50 border-2 border-slate-300 focus:border-blue-600 focus:bg-white rounded-xl px-4 py-3.5 text-center text-3xl font-black text-slate-900 placeholder-slate-400 outline-none transition-all tracking-widest">

          <button id="btnValidar" onclick="validarDNI()"
            class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 transition-all uppercase tracking-wider text-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <span id="btnValidarText">Validar</span>
          </button>
        </div>
      </div>

      <!-- Result Container (Hidden initially) -->
      <div id="resultadoContainer" class="hidden"></div>

    </section>

    <!-- ==================== PESTAÑA 2: EN OBRA ==================== -->
    <section id="tab-en-obra" class="hidden space-y-4">

      <div class="flex items-center justify-between">
        <div>
          <h2 class="font-bold text-lg text-slate-900">Trabajadores en Obra</h2>
          <p class="text-xs text-slate-600 font-medium">Personal actualmente dentro del condominio</p>
        </div>
        <span id="badgeCountEnObra"
          class="bg-blue-100 text-blue-900 border border-blue-300 px-3 py-1 rounded-full text-xs font-black">
          0 personas
        </span>
      </div>

      <!-- Buscador rápido en obra (Alto contraste para sol) -->
      <div class="relative">
        <input type="text" id="searchEnObra" oninput="filtrarTrabajadoresEnObra()"
          placeholder="Buscar por Nombre, DNI o Propietario..."
          class="w-full bg-white border-2 border-slate-400 focus:border-blue-600 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-900 font-semibold placeholder-slate-500 focus:outline-none shadow-sm transition-all">
        <svg class="w-4 h-4 text-slate-600 absolute left-3.5 top-3.5" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Lista de trabajadores activos -->
      <div id="listaEnObra" class="space-y-2.5">
        <!-- Renderizado dinámico -->
      </div>

    </section>

  </main>

  <!-- Fixed Bottom Navigation Bar (2 Pestañas) -->
  <nav
    class="fixed bottom-0 inset-x-0 bg-white/95 border-t border-slate-200 backdrop-blur-lg z-30 max-w-md mx-auto shadow-lg">
    <div class="grid grid-cols-2 h-16">

      <!-- Tab 1: Validar -->
      <button id="navBtnValidar" onclick="switchTab('validar')"
        class="flex flex-col items-center justify-center gap-1 text-blue-600 font-bold text-[11px] transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span>Validar</span>
      </button>

      <!-- Tab 2: En Obra -->
      <button id="navBtnEnObra" onclick="switchTab('en-obra')"
        class="flex flex-col items-center justify-center gap-1 text-slate-500 font-medium text-[11px] transition-colors relative">
        <div class="relative">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
            </path>
          </svg>
          <span id="navBadgeEnObra"
            class="hidden absolute -top-1 -right-2 bg-blue-600 text-white text-[9px] font-black w-4 h-4 rounded-full items-center justify-center">
            0
          </span>
        </div>
        <span>En Obra</span>
      </button>

    </div>
  </nav>

  <!-- Modal de Configuración Supabase -->
  <div id="settingsModal"
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl animate-pop">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base">Configurar Supabase</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Supabase URL</label>
          <input type="text" id="cfgUrl" placeholder="https://xyz.supabase.co"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Supabase Anon Key</label>
          <input type="password" id="cfgKey" placeholder="eyJhbGciOi..."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <button onclick="saveSettings()"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-blue-600/30">
        Guardar Cambios
      </button>
    </div>
  </div>

  <script>
    // Configuration & State
    let SUPABASE_URL = "https://tvxngammtltditnnsokn.supabase.co";
    let SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eG5nYW1tdGx0ZGl0bm5zb2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDkyMTEsImV4cCI6MjEwNTg4NTIxMX0.Q9Dav40O7-CAT1IcKVMW2s62QvQfCrR8HauxYNR66Gs";

    let supabaseClient = null;
    let currentValidatedWorkers = [];

    function initSupabase() {
      if (SUPABASE_KEY && SUPABASE_URL) {
        try {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          updateBadgeStatus(true);
        } catch (e) {
          console.error("Error al iniciar Supabase:", e);
          updateBadgeStatus(false);
        }
      } else {
        supabaseClient = null;
        updateBadgeStatus(false);
      }
    }

    function updateBadgeStatus(connected) {
      const badge = document.getElementById("connectionBadge");
      if (connected && navigator.onLine) {
        // ESTADO: CONECTADO (Verde legible sobre fondo claro)
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span><span>Conectado</span>`;
      } else {
        // ESTADO: SIN CONEXIÓN (Rojo legible sobre fondo claro)
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-red-100 text-red-800 border border-red-300";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></span><span>Sin Conexión</span>`;
      }
    }

    let offlineTimeout = null;

    // Manejo inteligente de red con margen de tolerancia
    window.addEventListener('online', () => {
      clearTimeout(offlineTimeout);
      updateBadgeStatus(true);
    });

    window.addEventListener('offline', () => {
      clearTimeout(offlineTimeout);
      // Espera 3.5 segundos antes de marcar "Sin Conexión" por si es un micro-parpadeo
      offlineTimeout = setTimeout(() => {
        updateBadgeStatus(false);
      }, 3500);
    });

    function playAudioFeedback(isOk) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isOk) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
          osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.12); // E3
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }

        // Cierra el contexto de audio liberando la memoria del teléfono
        setTimeout(() => {
          if (ctx.state !== 'closed') {
            ctx.close();
          }
        }, 400);

      } catch (e) { }
    }

    // Función para formatear fechas de "YYYY-MM-DD" a "DD de [mes]"
    function formatearFechaTexto(fechaString) {
      if (!fechaString) return '---';

      const fecha = new Date(fechaString + 'T00:00:00');
      const opciones = { day: '2-digit', month: 'long' };

      // Convierte la fecha a texto y reemplaza cualquier guion por un espacio
      return fecha.toLocaleDateString('es-PE', opciones).replace(/-/g, ' ');
    }

    async function validarDNI() {
      const input = document.getElementById("dniInput");
      const query = input.value.trim();
      const container = document.getElementById("resultadoContainer");

      if (!query || !supabaseClient) return;

      let workersList = [];

      if (currentSearchMode === 'sctr') {
        // 1. BÚSQUEDA SCTR (Por DNI)
        const { data: workersData, error } = await supabaseClient
          .from('trabajadores_sctr')
          .select('*, directorio ( Propietario )')
          .eq('dni', query);

        if (workersData && workersData.length > 0) {
          workersList = workersData.map(worker => ({
            ...worker,
            propietario: worker.directorio?.Propietario || "No asignado",
            tipo_registro: 'SCTR'
          }));
        }
      } else {
        // 2. BÚSQUEDA CELESTES (Por Código Fotocheck, ej: C12)
        // Nota: Asegúrate de que tu tabla en Supabase se llame 'trabajadores_particulares'
        const { data: workersData, error } = await supabaseClient
          .from('trabajadores_particulares')
          .select('*, directorio ( Propietario )')
          .eq('codigo_fotocheck', query);

        if (workersData && workersData.length > 0) {
          workersList = workersData.map(worker => ({
            dni: worker.dni || '---',
            nombre_completo: worker.nombre_completo,
            codigo_casa: worker.codigo_casa,
            propietario: worker.directorio?.Propietario || (worker.codigo_casa ? `Casa ${worker.codigo_casa}` : "Sin casa asignada"),
            codigo_fotocheck: worker.codigo_fotocheck,
            tipo_registro: 'CELESTE'
          }));
        }
      }

      renderResultadoCard(workersList, query);
    }

    function renderResultadoCard(workersList, query) {
      const container = document.getElementById("resultadoContainer");
      container.innerHTML = "";
      container.classList.remove("hidden");

      // CASO 1: NO REGISTRADO
      if (!workersList || workersList.length === 0) {
        playAudioFeedback(false);
        const tipoTexto = currentSearchMode === 'celeste' ? 'Fotocheck Celeste' : 'DNI';
        container.innerHTML = `
      <div class="bg-red-50 border-2 border-red-500 rounded-2xl p-5 space-y-3 shadow-md animate-pop">
        <div class="flex items-center gap-2.5 text-red-800">
          <div class="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center font-black text-lg">✕</div>
          <div>
            <h3 class="font-black text-base text-red-950 uppercase tracking-wide">NO REGISTRADO</h3>
          </div>
        </div>
        <p class="text-xs text-red-900 bg-red-100 p-3 rounded-xl border border-red-200 font-medium">
          El ${tipoTexto} <b>${query}</b> no se encuentra registrado en el sistema. Acceso denegado.
        </p>
      </div>
    `;
        return;
      }

      playAudioFeedback(true);
      currentValidatedWorkers = workersList;

      const nombreTrabajador = workersList[0].nombre_completo;
      const esCeleste = workersList[0].tipo_registro === 'CELESTE';
      const now = new Date();
      const hoy = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      let htmlContent = `
    <div class="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 shadow-md animate-pop">
      <div class="text-center border-b border-slate-100 pb-3">
        <span class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase mb-1 ${esCeleste ? 'bg-sky-100 text-sky-800 border border-sky-300' : 'bg-blue-100 text-blue-800 border border-blue-300'}">
          ${esCeleste ? `💳 Celeste (${workersList[0].codigo_fotocheck})` : '👷‍♂️ Personal de Obra'}
        </span>
        <span class="text-slate-900 font-black text-lg leading-tight block">${nombreTrabajador}</span>
      </div>
      <h3 class="text-center font-bold text-[13px] text-slate-800">¿A qué casa ingresa hoy?</h3>
      <div class="space-y-3">
  `;

      workersList.forEach((worker, index) => {
        if (esCeleste) {
          // TARJETA CELESTE (No calcula vencimiento)
          htmlContent += `
        <div class="bg-sky-50/60 border border-sky-200 rounded-xl p-3.5 space-y-2">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-500 shadow-sm"></span>
            <span class="font-extrabold text-[13px] text-sky-950">${worker.propietario}</span>
          </div>
          <button onclick="confirmarIngreso(${index})" class="w-full bg-sky-600 hover:bg-sky-700 active:scale-[0.98] text-white font-extrabold py-2.5 rounded-lg shadow-sm shadow-sky-600/20 text-xs transition-all tracking-wide uppercase">
            REGISTRAR INGRESO
          </button>
        </div>
      `;
        } else {
          // TARJETA SCTR (Calcula días de vencimiento)
          const [vYear, vMonth, vDay] = worker.fecha_vencimiento.split('-');
          const vencimiento = new Date(vYear, vMonth - 1, vDay);
          const diffMs = vencimiento - hoy;
          const diasRestantes = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

          if (worker.activo && diasRestantes >= 0) {
            const badgeDiasText = diasRestantes === 0 ? "Vence hoy" : `Vence en ${diasRestantes} días`;
            htmlContent += `
          <div class="bg-emerald-50/50 border border-emerald-200 rounded-xl p-3.5 space-y-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm"></span>
              <span class="font-extrabold text-[13px] text-emerald-950">${worker.propietario}</span>
            </div>
            <p class="text-[11px] text-emerald-700 font-bold ml-4">SCTR Vigente (${badgeDiasText})</p>
            <button onclick="confirmarIngreso(${index})" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-extrabold py-2.5 rounded-lg shadow-sm shadow-emerald-600/20 text-xs transition-all tracking-wide uppercase">
              REGISTRAR INGRESO
            </button>
          </div>
        `;
          } else {
            htmlContent += `
          <div class="bg-red-50/50 border border-red-200 rounded-xl p-3.5 space-y-2 opacity-90">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-sm"></span>
              <span class="font-extrabold text-[13px] text-red-950">${worker.propietario}</span>
            </div>
            <p class="text-[11px] text-red-700 font-bold ml-4">SCTR Vencido</p>
            <button disabled class="w-full bg-slate-200 text-slate-400 font-extrabold py-2.5 rounded-lg text-xs tracking-wide cursor-not-allowed uppercase">
              ACCESO DENEGADO
            </button>
          </div>
        `;
          }
        }
      });

      htmlContent += `</div></div>`;
      container.innerHTML = htmlContent;
    }

    async function confirmarIngreso(index) {
      if (!currentValidatedWorkers || currentValidatedWorkers.length === 0 || !supabaseClient) return;

      const container = document.getElementById("resultadoContainer");
      const data = currentValidatedWorkers[index];
      const esCeleste = data.tipo_registro === 'CELESTE';

      // Animación de Éxito
      container.innerHTML = `
    <div class="${esCeleste ? 'bg-sky-600' : 'bg-emerald-600'} text-white rounded-2xl p-6 text-center space-y-3 shadow-xl animate-pop">
      <div class="w-20 h-20 bg-white ${esCeleste ? 'text-sky-600' : 'text-emerald-600'} rounded-full flex items-center justify-center mx-auto shadow-md">
        <svg class="w-12 h-12 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-black tracking-wider uppercase">¡REGISTRADO!</h2>
    </div>
  `;

      // Diferenciar la observación con categorías exactas para facilitar los filtros en Excel
      const textoObservacion = esCeleste ? 'CELESTE' : 'OBRAS';

      await supabaseClient
        .from('historial_ingresos')
        .insert([{
          dni: data.dni,
          nombre_trabajador: data.nombre_completo,
          codigo_casa: data.codigo_casa,
          propietario: data.propietario,
          estado: 'PERMITIDO',
          observaciones: textoObservacion
        }]);

      setTimeout(() => {
        if (currentSearchMode === 'celeste') {
          document.getElementById("dniInput").value = "C";
        } else {
          document.getElementById("dniInput").value = "";
        }
        container.classList.add("hidden");
        currentValidatedWorkers = [];
        document.getElementById("dniInput").focus();
        cargarTrabajadoresEnObra();
      }, 1400);
    }

    async function cargarTrabajadoresEnObra() {
      if (!supabaseClient) return;

      const { data } = await supabaseClient
        .from('historial_ingresos')
        .select('*')
        .is('fecha_salida', null)
        .eq('estado', 'PERMITIDO')
        .order('created_at', { ascending: false });

      window.cacheEnObra = data || [];
      renderListaEnObra(window.cacheEnObra);
    }

    function renderListaEnObra(items) {
      const container = document.getElementById("listaEnObra");
      const badgeNav = document.getElementById("navBadgeEnObra");
      const badgeCount = document.getElementById("badgeCountEnObra");

      // Actualizar contadores
      badgeCount.innerText = `${items.length} persona${items.length === 1 ? '' : 's'}`;
      if (items.length > 0) {
        badgeNav.innerText = items.length;
        badgeNav.classList.remove("hidden");
        badgeNav.classList.add("flex");
      } else {
        badgeNav.classList.add("hidden");
        badgeNav.classList.remove("flex");
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 bg-white border border-slate-300 rounded-2xl p-4 text-slate-600 font-semibold text-xs shadow-sm">
            No hay trabajadores dentro del condominio actualmente.
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(w => {
        const hora = new Date(w.created_at).toLocaleTimeString('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit' });

        // Muestra el propietario (y la casa si está disponible)
        const propietarioNombre = w.propietario || `Casa ${w.codigo_casa}`;
        const codigoCasaTag = w.codigo_casa ? ` (${w.codigo_casa})` : '';

        return `
          <div class="bg-white border-2 border-slate-200 rounded-xl p-3.5 flex items-center justify-between gap-3 shadow-sm transition-all">
            <div class="space-y-1 min-w-0 flex-1">
              <!-- Propietario / Destino -->
              <div class="flex items-center gap-1.5">
                <span class="bg-blue-100 text-blue-950 border border-blue-300 text-[10px] font-black px-2 py-0.5 rounded truncate max-w-full">
                  ${propietarioNombre}
                </span>
              </div>

              <!-- Nombre del trabajador -->
              <h4 class="font-extrabold text-slate-900 text-sm truncate">${w.nombre_trabajador}</h4>

              <!-- DNI y Hora de Ingreso en la parte inferior -->
              <div class="flex items-center gap-2 text-[11px] text-slate-700 font-bold flex-wrap">
                <span>DNI: ${w.dni}</span>
                <span class="text-slate-300">•</span>
                <span class="text-emerald-800 font-extrabold">Ingresó ${hora}</span>
              </div>
            </div>

            <!-- Botón Salida -->
            <button 
              onclick="marcarSalida(${w.id || `'\${w.dni}'`})" 
              class="bg-red-600 hover:bg-red-700 active:scale-95 text-white px-3.5 py-2 rounded-xl text-xs font-black shrink-0 transition-all flex items-center gap-1 shadow-md shadow-red-600/20 tracking-wide uppercase"
            >
              <span>Salida</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    function filtrarTrabajadoresEnObra() {
      const q = document.getElementById("searchEnObra").value.toLowerCase().trim();
      if (!window.cacheEnObra) return;

      const filtrados = window.cacheEnObra.filter(w =>
        (w.nombre_trabajador && w.nombre_trabajador.toLowerCase().includes(q)) ||
        (w.dni && w.dni.includes(q)) ||
        (w.propietario && w.propietario.toLowerCase().includes(q))
      );

      renderListaEnObra(filtrados);
    }

    async function marcarSalida(idOrDni) {
      if (!supabaseClient) return;
      const horaPeru = new Date().toLocaleString("sv-SE", { timeZone: "America/Lima" });

      if (typeof idOrDni === 'number') {
        await supabaseClient
          .from('historial_ingresos')
          .update({ fecha_salida: horaPeru })
          .eq('id', idOrDni);
      } else {
        await supabaseClient
          .from('historial_ingresos')
          .update({ fecha_salida: horaPeru })
          .eq('dni', idOrDni)
          .is('fecha_salida', null);
      }

      cargarTrabajadoresEnObra();
    }

    function switchTab(tab) {
      document.getElementById("tab-validar").classList.add("hidden");
      document.getElementById("tab-en-obra").classList.add("hidden");

      // Reset Nav button colors
      document.getElementById("navBtnValidar").className = "flex flex-col items-center justify-center gap-1 text-slate-400 font-medium text-[11px] transition-colors";
      document.getElementById("navBtnEnObra").className = "flex flex-col items-center justify-center gap-1 text-slate-400 font-medium text-[11px] transition-colors relative";

      if (tab === 'validar') {
        document.getElementById("tab-validar").classList.remove("hidden");
        document.getElementById("navBtnValidar").className = "flex flex-col items-center justify-center gap-1 text-blue-500 font-bold text-[11px] transition-colors";
        document.getElementById("dniInput").focus();
      } else if (tab === 'en-obra') {
        document.getElementById("tab-en-obra").classList.remove("hidden");
        document.getElementById("navBtnEnObra").className = "flex flex-col items-center justify-center gap-1 text-blue-500 font-bold text-[11px] transition-colors relative";
        cargarTrabajadoresEnObra();
      }
    }

    function openSettingsModal() {
      document.getElementById("cfgUrl").value = SUPABASE_URL;
      document.getElementById("cfgKey").value = SUPABASE_KEY;
      document.getElementById("settingsModal").classList.remove("hidden");
    }

    function closeSettingsModal() {
      document.getElementById("settingsModal").classList.add("hidden");
    }

    function saveSettings() {
      SUPABASE_URL = document.getElementById("cfgUrl").value.trim();
      SUPABASE_KEY = document.getElementById("cfgKey").value.trim();

      localStorage.setItem("tot_supa_url", SUPABASE_URL);
      localStorage.setItem("tot_supa_key", SUPABASE_KEY);

      initSupabase();
      closeSettingsModal();
      alert("Configuración actualizada.");
    }

    document.getElementById("dniInput").addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        this.blur(); // 👈 Le dice al celular "cierra el teclado ahora"
        validarDNI();
      }
    });

    // App Startup
    initSupabase();
    cargarTrabajadoresEnObra();

    let currentSearchMode = 'sctr'; // 'sctr' o 'celeste'

    function setSearchMode(mode) {
      currentSearchMode = mode;
      const input = document.getElementById("dniInput");
      const btnSctr = document.getElementById("btnModoSctr");
      const btnCeleste = document.getElementById("btnModoCeleste");
      const lbl = document.getElementById("lblSearchInput");
      const btnText = document.getElementById("btnValidarText");

      if (mode === 'sctr') {
        // Apariencia botones
        btnSctr.className = "py-2.5 px-3 rounded-lg text-xs font-black transition-all flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow-md shadow-blue-600/20";
        btnCeleste.className = "py-2.5 px-3 rounded-lg text-xs font-black transition-all flex items-center justify-center gap-1.5 bg-transparent text-slate-500 hover:text-slate-800";

        // Configuración del campo
        lbl.innerText = "Ingrese DNI del trabajador";
        input.placeholder = "Escriba DNI aquí...";
        input.maxLength = 8;
        input.value = "";
        btnText.innerText = "Validar";
      } else {
        // Apariencia botones
        btnCeleste.className = "py-2.5 px-3 rounded-lg text-xs font-black transition-all flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow-md shadow-blue-600/20";
        btnSctr.className = "py-2.5 px-3 rounded-lg text-xs font-black transition-all flex items-center justify-center gap-1.5 bg-transparent text-slate-500 hover:text-slate-800";

        // Configuración del campo
        lbl.innerText = "Ingrese código de carnet";
        input.value = "C";
        input.placeholder = "C2, C10...";
        input.maxLength = 6;
        btnText.innerText = "Validar  ";
      }

      input.focus();
    }

    // Mantiene la "C" fija y solo deja escribir números a continuación
    document.getElementById("dniInput").addEventListener("input", function () {
      if (currentSearchMode === 'celeste') {
        let raw = this.value.toUpperCase();
        if (!raw.startsWith("C")) {
          raw = "C" + raw.replace(/[^0-9]/g, "");
        } else {
          raw = "C" + raw.substring(1).replace(/[^0-9]/g, "");
        }
        this.value = raw;
      }
    });
  </script>

</body>
